<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>역사적 주가 vs ML 예측 비교</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { background-color: #f8f9fa; font-family: 'Malgun Gothic', sans-serif; }
        .dashboard-header { background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%); color: white; padding: 2rem; border-radius: 0 0 15px 15px; margin-bottom: 2rem; }
        .card { border: none; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
        .chart-container { position: relative; height: 50vh; width: 100%; }
    </style>
</head>
<body>

    <div class="container-fluid px-4">
        <div class="dashboard-header text-center shadow">
            <h1 class="fw-bold m-0">📊 역사적 주가 vs ML 예측 비교 대시보드</h1>
            <p class="lead m-0 mt-2 text-white-50">최근 2년 역사적 데이터와 동일 기간 ML 모델 예측을 비교 분석합니다.</p>
        </div>

        <div class="row">
            <div class="col-11 mx-auto">
                <div class="card p-4">
                    <h3 class="card-title fw-bold mb-4 text-secondary">📈 종목별 비교 차트 (예시: 삼성전자)</h3>
                    <div class="chart-container">
                        <canvas id="historicalChart"></canvas>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const ticker = '005930.KS'; // 삼성전자 기준
        fetch(`/api/historical-vs-prediction/${ticker}`)
            .then(response => response.json())
            .then(data => {
                if (data.error) {
                    alert("데이터를 가져오는 중 오류 발생: " + data.error);
                    return;
                }

                const ctx = document.getElementById('historicalChart').getContext('2d');
                new Chart(ctx, {
                    type: 'line',
                    data: {
                        labels: data.labels, // 🚀 총 72개월의 거대한 X축 라벨!
                        datasets: [
                            {
                                label: '5개년 실제 주가 추이',
                                data: data.actual_historical_5y,
                                borderColor: '#4e73df',
                                backgroundColor: 'rgba(78, 115, 223, 0.05)',
                                fill: true,
                                tension: 0.1,
                                pointRadius: 1
                            },
                            {
                                label: 'AI 예측 주가 (과거 검증 ~ 미래 12개월)',
                                data: data.predicted_2y_plus_future,
                                borderColor: '#e74a3b',
                                borderDash: [6, 4], // 점선 스타일
                                fill: false,
                                tension: 0.1,
                                pointRadius: 1
                            }
                        ]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        scales: {
                            y: {
                                beginAtZero: false,
                                title: { display: true, text: '가격 (원화: ₩)' },
                                ticks: {
                                    callback: function(value) {
                                        return value.toLocaleString() + '원';
                                    }
                                }
                            }
                        }
                    }
                });
            })
            .catch(err => console.error("Fetch Error:", err));
    </script>
</body>
</html>
