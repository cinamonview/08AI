<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🔮 경륜장 실전 AI 예측 엔진</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { background-color: #f8f9fa; font-family: 'Malgun Gothic', sans-serif; }
        .main-header { background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%); color: white; padding: 30px 0; border-radius: 0 0 20px 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        .card { border-radius: 15px; border: none; box-shadow: 0 4px 10px rgba(0,0,0,0.05); }
        .table th { background-color: #e9ecef; }
        .chart-container { max-width: 550px; margin: 0 auto; }
    </style>
</head>
<body>

<div class="container text-center main-header mb-5">
    <h1 class="fw-bold">🏁 경륜장 AI 실전 예측 시스템</h1>
    <p class="lead mb-0">오라클 DB 데이터를 기반으로 분석한 실시간 모의 레이스 결과</p>
</div>

<div class="container">
    <div class="text-center mb-4">
        <button id="btn-predict" class="btn btn-primary btn-lg px-5 shadow">🔮 AI 모의 레이스 분석 시작</button>
    </div>

    <div class="row">
        <div class="col-lg-7 mb-4">
            <div class="card p-4 h-100">
                <h3 class="fw-bold mb-3 text-secondary">📋 AI 예측 순위표</h3>
                <div class="table-responsive">
                    <table class="table table-hover align-middle text-center">
                        <thead>
                            <tr>
                                <th>순위</th>
                                <th>선수명</th>
                                <th>훈련지</th>
                                <th>승률</th>
                                <th>최종 점수</th>
                            </tr>
                        </thead>
                        <tbody id="predict-result">
                            <tr>
                                <td colspan="5" class="text-muted py-5">위 버튼을 누르면 분석 결과가 출력됩니다.</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>

        <div class="col-lg-5 mb-4">
            <div class="card p-4 h-100 text-center">
                <h3 class="fw-bold mb-3 text-secondary">🕸️ TOP 3 선수 능력치 비교</h3>
                <div class="chart-container py-3">
                    <canvas id="radarChart"></canvas>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
let myRadarChart = null; // 차트 객체를 담을 변수

document.getElementById('btn-predict').addEventListener('click', function() {
    const tbody = document.getElementById('predict-result');
    tbody.innerHTML = `<tr><td colspan="5" class="text-primary py-5"><div class="spinner-border" role="status"></div><br><br>AI 엔진 연산 중...</td></tr>`;

    // 플라스크 API 호출
    fetch('/api/predict')
        .then(response => response.json())
        .then(res => {
            if(res.status === 'success') {
                let html = '';
                
                // 1. 표(Table)에 데이터 뿌리기
                res.data.forEach(row => {
                    html += `
                        <tr class="${row.rank <= 3 ? 'table-light fw-bold' : ''}">
                            <td><span class="badge ${row.rank <= 3 ? 'bg-danger' : 'bg-secondary'}">${row.rank}위</span></td>
                            <td class="text-primary">${row.name}</td>
                            <td>${row.team}</td>
                            <td>${row.win}%</td>
                            <td class="text-danger fw-bold">🔥 ${row.score}점</td>
                        </tr>
                    `;
                });
                tbody.innerHTML = html;

                // 2. 상위 3명 선수의 레이더 차트 데이터 추출
                const topPlayers = res.data.slice(0, 3);
                
                // 기존에 그려진 차트가 있다면 파괴하고 새로 그립니다 (잔상 버그 방지)
                if (myRadarChart) {
                    myRadarChart.destroy();
                }

                // 선수별 색상 테마 설정
                const colors = [
                    { fill: 'rgba(255, 99, 132, 0.2)', border: 'rgba(255, 99, 132, 1)' },  // 1등: 레드
                    { fill: 'rgba(54, 162, 235, 0.2)', border: 'rgba(54, 162, 235, 1)' }, // 2등: 블루
                    { fill: 'rgba(75, 192, 192, 0.2)', border: 'rgba(75, 192, 192, 1)' }  // 3등: 민트
                ];

                const datasets = topPlayers.map((player, idx) => {
                    return {
                        label: player.name,
                        data: [player.win, player.top2, player.top3, player.score], // 축으로 쓸 능력치 배열
                        backgroundColor: colors[idx].fill,
                        borderColor: colors[idx].border,
                        borderWidth: 2,
                        pointBackgroundColor: colors[idx].border
                    }
                });

                // 3. Chart.js 레이더 차트 생성 구역
                const ctx = document.getElementById('radarChart').getContext('2d');
                myRadarChart = new Chart(ctx, {
                    type: 'radar',
                    data: {
                        labels: ['순수 승률(1등)', '연대율(2등이내)', '삼연대율(3등이내)', '최종 예측점수'], //
